services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - warehouse

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # No build args: secrets are provided only at runtime through env_file.
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse

  # One-off schema migration runner: docker compose --env-file .env.production run --rm migrate
  migrate:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app
    env_file:
      - .env.production
    volumes:
      - ./prisma:/app/prisma:ro
    command: sh -c "apk add --no-cache openssl libc6-compat >/dev/null && npx --yes prisma@5.22.0 migrate deploy"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse

volumes:
  postgres_data:

networks:
  warehouse:
    driver: bridge
