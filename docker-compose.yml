# Production stack for the warehouse app. The project name is pinned to the
# existing one so container, network and volume names stay the same
# (siu_warehouse-db-1, siu_warehouse_warehouse, siu_warehouse_postgres_data).
# Nothing here refers to other projects on the VPS.
#
# Images come from GHCR and are pinned to a commit SHA. Every compose command
# needs IMAGE_TAG, e.g.:
#   IMAGE_TAG=$(cat .deployed-image-tag) docker compose --env-file .env.production ps
name: siu_warehouse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - warehouse

  app:
    # Built and pushed by .github/workflows/deploy.yml; never built on the server.
    image: ghcr.io/xuskaciise/warehouse:${IMAGE_TAG:?IMAGE_TAG must be set (see deploy.sh)}
    restart: unless-stopped
    ports:
      # Loopback only: reachable through the host's reverse proxy, not directly.
      - "127.0.0.1:${APP_PORT:-3009}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse

  # One-off: runs `prisma migrate deploy` from the migrator image of the same
  # commit. Started only explicitly (deploy.sh), never by `up`.
  migrate:
    image: ghcr.io/xuskaciise/warehouse:${IMAGE_TAG:?IMAGE_TAG must be set (see deploy.sh)}-migrator
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse

volumes:
  postgres_data:

networks:
  warehouse:
    driver: bridge
