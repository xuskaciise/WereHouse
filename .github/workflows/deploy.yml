name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Never run two production deploys at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xuskaciise/warehouse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse deploys from other branches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploys are only allowed from main (got ${{ github.ref }})"
          exit 1

      - name: API route guard check
        run: node scripts/check-route-guards.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the image never contains DATABASE_URL, AUTH_SECRET or
      # any other secret (DEPLOY-01). Secrets are injected at runtime from
      # .env.production on the server.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in GitHub
    # (Settings > Environments > production) to approve each deploy.
    environment: production
    permissions:
      contents: read
      packages: read # lets the short-lived GITHUB_TOKEN pull from ghcr.io on the VPS
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_PORT }}
      REMOTE_DIR: /root/SIU_WAREHOUSE
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy.sh
            scripts/backup-warehouse-db.sh
          sparse-checkout-cone-mode: false

      - name: Setup SSH (pinned host key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Secret VPS_KNOWN_HOSTS is not set; refusing to trust an unknown host key." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.VPS_HOST }}
            Port $SSH_PORT
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF

      # The server no longer needs a git checkout (works with a private repo):
      # only the deploy files are copied; code and migrations come in the images.
      - name: Upload deploy files
        run: |
          ssh deploy-target "mkdir -p '$REMOTE_DIR/scripts'"
          scp docker-compose.yml deploy.sh deploy-target:"$REMOTE_DIR/"
          scp scripts/backup-warehouse-db.sh deploy-target:"$REMOTE_DIR/scripts/"
          ssh deploy-target "chmod 755 '$REMOTE_DIR/deploy.sh' '$REMOTE_DIR/scripts/backup-warehouse-db.sh'"

      - name: Pull images on the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target \
            "cd '$REMOTE_DIR' && ./deploy.sh pull '${{ github.sha }}' '${{ github.actor }}'"

      - name: Backup, migrate, switch, health check (auto-rollback on failure)
        run: ssh deploy-target "cd '$REMOTE_DIR' && ./deploy.sh deploy '${{ github.sha }}'"
