name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/claude.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/warehouse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/SIU_WAREHOUSE

          echo "=== Backup ==="
          /usr/local/bin/db-backup.sh || echo "backup warning"

          echo "=== Pull code ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Pull image ==="
          docker compose --env-file .env.production pull app

          echo "=== Migrate ==="
          docker run --rm \
            --network siu_warehouse_warehouse \
            -v /root/SIU_WAREHOUSE/prisma:/app/prisma \
            -w /app \
            --env-file /root/SIU_WAREHOUSE/.env.production \
            node:20-alpine \
            sh -c "npx --yes prisma@5.22.0 migrate deploy"

          echo "=== Up ==="
          docker compose --env-file .env.production up -d --no-build

          echo "=== Health ==="
          sleep 10
          curl -sf -o /dev/null http://127.0.0.1:3009 && echo "OK" || (docker compose logs --tail 50 app; exit 1)

          docker image prune -f
          REMOTE
